# 울산대 공지·비교과 → 노션 자동 수집 (PLAN.md 6장, 8-2)
name: crawl

on:
  schedule:
    - cron: "17 * * * *"    # 매시 17분 (UTC)
  workflow_dispatch:         # Actions 탭의 수동 실행 버튼

# 기본은 저장소 읽기만. 쓰기는 아래 save-state 작업에만 따로 준다.
permissions:
  contents: read

# 앞 실행이 끝나기 전에 다음 실행이 겹치지 않게 한다 (같은 행이 두 번 생기는 것 방지).
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # 공식 Action만 쓰고, 태그가 바뀌어도 영향이 없도록 커밋 해시로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 테스트가 하나라도 실패하면 노션에 쓰지 않는다. 네트워크·노션 없이 돈다.
      - name: 테스트
        run: python -m pytest -q

      - name: 수집 → 노션
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m src.main

      # 사이트 하나가 실패해도(종료 코드 1) 그때까지의 기록은 넘긴다.
      - name: 기록 넘기기
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: seen-state
          path: state/seen.json
          if-no-files-found: ignore
          retention-days: 1

  # '이미 본 글' 기록(state/seen.json)만 커밋한다. 수집 코드와 의존성은 이 작업에서 실행하지 않는다.
  save-state:
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main

      - name: 기록 받기
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: seen-state
          path: state

      - name: 기록 확인 후 커밋
        if: steps.download.outcome == 'success'
        run: |
          # 형식 확인: https://*.ulsan.ac.kr 링크와 YYYY-MM-DD 날짜만 허용
          python3 - <<'PY'
          import json, re, sys
          d = json.load(open("state/seen.json"))
          ok = (isinstance(d, dict) and d.get("version") == 1 and isinstance(d.get("seen"), dict)
                and all(re.fullmatch(r"https://([\w-]+\.)*ulsan\.ac\.kr(/\S*)?", u) and re.fullmatch(r"\d{4}-\d{2}-\d{2}", v)
                        for u, v in d["seen"].items()))
          sys.exit(0 if ok else "기록 파일 형식이 잘못돼 커밋하지 않음")
          PY
          # 기록 파일 외의 변경이 있으면 거부
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then echo "기록 변경 없음"; exit 0; fi
          if [ "$changed" != " M state/seen.json" ] && [ "$changed" != "?? state/seen.json" ] && [ "$changed" != "?? state/" ]; then
            echo "기록 파일 외의 변경이 있어 커밋하지 않음:"; echo "$changed"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "기록 갱신 (state/seen.json)"
          git push || { git pull --rebase && git push; }
