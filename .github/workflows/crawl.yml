# 울산대 공지·비교과 → 노션 자동 수집 (PLAN.md 6장, 8-2)
name: crawl

on:
  schedule:
    - cron: "17 * * * *"    # 매시 17분 (UTC)
  workflow_dispatch:         # Actions 탭의 수동 실행 버튼

# 저장소 읽기만 허용한다.
permissions:
  contents: read

# 앞 실행이 끝나기 전에 다음 실행이 겹치지 않게 한다 (같은 행이 두 번 생기는 것 방지).
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 공식 Action만 쓰고, 태그가 바뀌어도 영향이 없도록 커밋 해시로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 테스트가 하나라도 실패하면 노션에 쓰지 않는다. 네트워크·노션 없이 돈다.
      - name: 테스트
        run: python -m pytest -q

      - name: 수집 → 노션
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m src.main
